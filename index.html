<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111521"><title>Almas Gêmeas • Gestão PRO 2.0</title><style>
:root{--bg:#0d1019;--panel:#171c29;--panel2:#1d2434;--line:#30394b;--ink:#f6f4fb;--muted:#9ca5b7;--gold:#f4b86a;--mint:#60d6b3;--red:#ff788b;--violet:#b6a2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -18%,#2a284e,transparent 55%),var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#111521;border-right:1px solid var(--line);padding:23px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:9px 9px 24px}.brandmark{width:52px;height:52px;border-radius:50%;background:conic-gradient(#ff638c,#ffb847,#dbeb67,#58ddb6,#67b7ff,#b587ff,#ff638c);display:grid;place-items:center;box-shadow:0 0 28px #ff8c6644;transform-style:preserve-3d;animation:float 5s ease-in-out infinite}.brandmark b{width:42px;height:42px;border:2px solid #fff9;border-radius:50%;display:grid;place-items:center;color:white;font-size:22px;text-shadow:0 2px 7px #000}@keyframes float{50%{transform:translateY(-4px) rotateY(12deg)}}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--gold);letter-spacing:.13em;font-size:10px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#a8b1c4;text-align:left;border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:13px;transition:.2s}.nav button:hover{background:#252b3c;color:#fff;transform:translateX(3px)}.nav button.active{background:linear-gradient(110deg,#4b3844,#302a42);color:#fff;box-shadow:inset 3px 0 var(--gold)}.nav .ico{font-size:19px;width:22px;text-align:center}.sidefoot{border-top:1px solid var(--line);margin-top:30px;padding:20px 12px;color:var(--muted);font-size:12px;line-height:1.6}.main{padding:29px clamp(16px,3.5vw,52px) 70px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:750;text-transform:uppercase}.top h1{margin:7px 0 0;font-size:clamp(24px,3vw,34px);letter-spacing:-.04em}.top p{color:var(--muted);margin:8px 0 0;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #4d5360;background:#252c3d;color:white;border-radius:11px;padding:11px 15px;transition:.2s;font-weight:650;font-size:13px}.btn:hover{transform:translateY(-2px);border-color:var(--gold)}.btn.primary{background:linear-gradient(135deg,#f6c377,#d68d4a);color:#241a13;border:0;box-shadow:0 8px 24px #f4b86a25}.btn.danger{background:#412331;color:#ffb4c1;border-color:#643744}.btn.tiny{padding:7px 9px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:linear-gradient(155deg,#1b2232,#161c29);border:1px solid #303a4a;border-radius:18px;padding:20px;box-shadow:0 14px 45px #0002;transition:transform .25s,border-color .25s;min-width:0}.card:hover{transform:translateY(-2px);border-color:#666174}.metric .value{font-size:clamp(19px,2.5vw,29px);font-weight:800;letter-spacing:-.04em;margin-top:14px}.muted{color:var(--muted)}.metric .muted{font-size:12px}.metric .tag{color:var(--mint);font-size:11px;margin-top:8px}.section{margin-top:20px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.sectionhead h2{font-size:18px;margin:0}.card h3{margin:0 0 15px;font-size:16px}.info{font-size:13px;color:var(--muted);line-height:1.65}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:650}.table td,.table th{padding:13px 11px;border-bottom:1px solid #31394a}.table tr:last-child td{border-bottom:0}.table td.right,.table th.right{text-align:right}.pill{font-size:11px;padding:5px 9px;border-radius:25px;background:#273d3c;color:#7eefd1}.pill.warn{background:#4b3433;color:#ffc5a4}.actions{display:flex;gap:5px;justify-content:flex-end}.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#c6cbdb}.field input,.field select{background:#101623;color:var(--ink);border:1px solid #414c60;border-radius:11px;padding:12px;min-width:0;outline:none;width:100%}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f4b86a20}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#02040bba;backdrop-filter:blur(10px);display:none;z-index:100;align-items:center;justify-content:center;padding:17px}.modalback.open{display:flex}.modal{background:#1a2130;border:1px solid #535465;border-radius:22px;padding:24px;max-width:650px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 35px 100px #0009}.modal h2{margin:0 0 10px}.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.recipe-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}.notice{border-left:3px solid var(--gold);padding:11px 15px;background:#382d2c;border-radius:7px;color:#f3d1aa;font-size:12px;margin:15px 0}.bars{display:flex;height:140px;align-items:end;gap:13px;padding:8px 3px 0}.barcol{flex:1;text-align:center;min-width:0}.bar{background:linear-gradient(0deg,#9168dd,#e9b66e);border-radius:7px 7px 2px 2px;min-height:5px;animation:up .75s ease backwards;box-shadow:0 0 15px #d3a06925}.barcol span{display:block;font-size:10px;color:var(--muted);margin-top:8px;overflow:hidden;text-overflow:ellipsis}@keyframes up{from{height:0}}.profit{font-weight:700;color:var(--mint)}.scrollnote{font-size:12px;color:var(--muted);margin-top:12px}.menu{display:none}.statline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.statline:last-child{border:0}.receipt{display:flex;align-items:center;gap:9px;padding:8px 0}.receipt input{width:90px}.helper{font-size:11px;color:var(--muted);line-height:1.5}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:50;left:0;top:0;bottom:0;width:245px;transform:translateX(-100%);transition:.3s;box-shadow:20px 0 70px #0008}.sidebar.show{transform:translateX(0)}.menu{display:block}.main{padding:21px 14px 65px}.top{align-items:flex-start}.top h1{font-size:26px}.toolbar{justify-content:flex-end}.formgrid{grid-template-columns:1fr}.grid{gap:10px}.card{padding:14px}.metric .value{font-size:23px}.recipe-row{grid-template-columns:1fr 85px auto}}

.detail{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#111927}.lineitem{display:grid;grid-template-columns:1.2fr .7fr .65fr .75fr;gap:9px;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.lineitem.head{font-weight:700;color:var(--muted)}.lineitem:last-child{border:0}.hint{background:#25313c;border:1px solid #3c5865;color:#b8e9ea;padding:11px;border-radius:10px;font-size:12px;margin:12px 0}.field select{color:var(--ink)}.controls{display:flex;gap:8px;flex-wrap:wrap}.good{color:var(--mint)}.bad{color:var(--red)}.chip{padding:5px 9px;border:1px solid #52576a;border-radius:99px;font-size:11px;color:var(--gold)}.brandmark{overflow:hidden}.brandmark img{width:100%;height:100%;object-fit:cover} @media(max-width:640px){.lineitem{grid-template-columns:1fr .75fr;gap:5px}.lineitem.head{display:none}.top{flex-wrap:wrap}.toolbar{width:100%;justify-content:flex-start}}
</style></head><body><div class="app"><aside class="sidebar" id="side"><div class="brand"><div class="brandmark"><b>♥</b></div><div><strong>Almas Gêmeas</strong><small>GASTROBAR • GESTÃO PRO</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">Protótipo funcional V2.0.<br>Dados locais neste navegador.<br>Faça backup regularmente.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Almas Gêmeas • Gestão inteligente</div><h1 id="title">Visão geral</h1><p id="subtitle">Produção, estoque e lucro sem baixa duplicada.</p></div><div class="toolbar"><button class="btn menu" onclick="toggleMenu()">☰ Menu</button><button class="btn" onclick="exportData()">↓ Backup</button><button class="btn primary" id="newBtn">+ Novo</button></div></header><div id="content" class="fade"></div></main></div><div class="modalback" id="back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveBtn">Salvar</button></div></div></div><script>
'use strict';
const KEY='almas_gemeas_pro_v2',OLD='almas_gemeas_pro_v1';
const $=x=>document.getElementById(x), n=x=>Number(x)||0, money=x=>n(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=x=>n(x).toLocaleString('pt-BR',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>Date.now()*1000+Math.floor(Math.random()*1000), today=()=>new Date().toLocaleDateString('en-CA'), clone=x=>JSON.parse(JSON.stringify(x));
const defaultDB=()=>({version:2,ingredients:[{id:1,name:'Farinha de trigo',unit:'g',quantity:5000,avgCost:.005,min:500},{id:2,name:'Frango',unit:'g',quantity:3000,avgCost:.02,min:800},{id:3,name:'Leite',unit:'ml',quantity:4000,avgCost:.0055,min:1000},{id:4,name:'Óleo',unit:'ml',quantity:2700,avgCost:24/2700,min:500},{id:5,name:'Temperos',unit:'g',quantity:800,avgCost:.03,min:150}],recipes:[{id:101,name:'Coxinha de frango',yield:20,price:6,mode:'production',items:[{id:1,qty:500},{id:2,qty:600},{id:3,qty:300},{id:4,qty:100},{id:5,qty:50}],costs:{gas:1.8,energy:.5,labor:2.4,packaging:.7,other:0},ready:0,readyValue:0}],production:[],sales:[],purchases:[],expenses:[],movements:[],settings:{business:'Almas Gêmeas Gastrobar',markup:150,tax:0}});
function normalize(d){if(!d||!Array.isArray(d.ingredients)||!Array.isArray(d.recipes))throw Error('Estrutura de backup inválida');d.version=2;for(const i of d.ingredients){i.quantity=n(i.quantity);i.avgCost=Math.max(0,n(i.avgCost));i.min=n(i.min)}for(const r of d.recipes){r.mode=r.mode==='sales'?'sales':'production';r.ready=n(r.ready);r.readyValue=n(r.readyValue);r.yield=n(r.yield)||1;r.costs=r.costs||{gas:0,energy:0,labor:0,packaging:0,other:n(r.extra)};r.items=r.items||[]}for(const k of ['production','sales','purchases','expenses','movements'])d[k]??=[];d.settings??={business:'Almas Gêmeas Gastrobar',markup:150,tax:0};return d}
function migrate(old){let d=clone(old);for(const i of d.ingredients){i.avgCost=n(i.price)/Math.max(n(i.quantity),.000001);delete i.price}for(const r of d.recipes){r.mode='sales';r.ready=0;r.readyValue=0;r.costs={gas:0,energy:0,labor:0,packaging:0,other:n(r.extra)};delete r.extra}d.production=[];d.movements=[];d.version=2;return normalize(d)}
let db;try{let stored=localStorage.getItem(KEY);db=stored?normalize(JSON.parse(stored)):localStorage.getItem(OLD)?migrate(JSON.parse(localStorage.getItem(OLD))):defaultDB()}catch(e){db=defaultDB();alert('Não foi possível carregar os dados antigos. Abrimos dados demonstrativos; verifique seu backup.')}const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();
const ing=i=>db.ingredients.find(x=>x.id===n(i)),rec=i=>db.recipes.find(x=>x.id===n(i));
const ingredientCost=x=>{let i=ing(x.id);return i?n(x.qty)*i.avgCost:0}, ingredientTotal=r=>r.items.reduce((a,x)=>a+ingredientCost(x),0), extraTotal=r=>Object.values(r.costs||{}).reduce((a,x)=>a+n(x),0), batchCost=r=>ingredientTotal(r)+extraTotal(r), unitCost=r=>batchCost(r)/Math.max(1,n(r.yield));
const labelMode=x=>x==='production'?'Baixa na produção':'Baixa na venda';
const menus=[['dashboard','◈','Visão geral'],['ingredients','◉','Ingredientes e estoque'],['recipes','♨','Fichas técnicas'],['production','⚗','Produção e saldos'],['sales','▣','Vendas e caixa'],['purchases','▤','Compras'],['expenses','◇','Despesas'],['reports','▥','Relatórios'],['movements','⇄','Movimentações'],['settings','⚙','Administração']];let page='dashboard';
function navigate(p){page=p;$('side').classList.remove('show');render()}function toggleMenu(){$('side').classList.toggle('show')}
function render(){let m=menus.find(x=>x[0]===page);$('title').textContent=m?.[2]||'Visão geral';$('subtitle').textContent={dashboard:'Tudo que acontece no Gastrobar em um só lugar.',ingredients:'Custo médio real, quantidade física e estoque mínimo.',recipes:'Transparência total em cada ingrediente e custo.',production:'Produza lotes e transfira custos para o estoque pronto.',sales:'Venda sem descontar ingredientes duas vezes.',purchases:'Entradas com custo médio ponderado.',expenses:'Despesas gerenciais.',reports:'Resultados e análise por produto.',movements:'Histórico auditável de todas as baixas e entradas.',settings:'Preferências, importação e backup.'}[page];$('nav').innerHTML=menus.map(x=>`<button class="${page===x[0]?'active':''}" onclick="navigate('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');$('newBtn').style.display=['dashboard','reports','movements','settings'].includes(page)?'none':'';$('newBtn').onclick=()=>({ingredients:()=>editIngredient(),recipes:()=>editRecipe(),production:()=>produce(),sales:()=>sale(),purchases:()=>purchase(),expenses:()=>expense()})[page]?.();$('content').innerHTML=({dashboard,ingredients,recipes,production,sales,purchases,expenses,reports,movements,settings})[page]();}
const stat=(a,b)=>`<div class="statline"><span>${a}</span><strong>${b}</strong></div>`, cards=rows=>`<div class="grid">${rows.map(x=>`<div class="card metric"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div><div class="tag">${x[2]}</div></div>`).join('')}</div>`;
function total(){let sales=db.sales.reduce((a,x)=>a+n(x.qty)*n(x.price),0),cogs=db.sales.reduce((a,x)=>a+n(x.cost),0),expenses=db.expenses.reduce((a,x)=>a+n(x.amount),0);return {sales,cogs,expenses,margin:sales-cogs,result:sales-cogs-expenses}}
function dashboard(){let t=total(),low=db.ingredients.filter(x=>x.quantity<=x.min),value=db.ingredients.reduce((a,i)=>a+i.quantity*i.avgCost,0)+db.recipes.reduce((a,r)=>a+r.readyValue,0);return cards([['Receita de vendas',money(t.sales),'Vendas registradas'],['Resultado estimado',money(t.result),'Após custos registrados e despesas'],['Estoque valorizado',money(value),'Ingredientes e produtos prontos'],['Alertas de insumos',low.length+' itens','Estoque no mínimo ou abaixo']])+`<div class="two section"><div class="card"><h3>Acesso rápido</h3><div class="controls"><button class="btn primary" onclick="navigate('recipes')">Ver custos das receitas</button><button class="btn" onclick="produce()">+ Produzir</button><button class="btn" onclick="sale()">+ Registrar venda</button><button class="btn" onclick="purchase()">+ Comprar insumos</button></div><div class="hint">Cada produto escolhe sua própria regra: consumo na produção ou diretamente na venda.</div></div><div class="card"><h3>Estoque em alerta</h3>${low.length?low.map(x=>stat(esc(x.name),fmt(x.quantity)+' '+esc(x.unit))).join(''):'<p class="info">Nenhum item abaixo do mínimo.</p>'}</div></div><div class="notice">Versão demonstrativa: armazenamento local, sem multiusuários ou integração fiscal. Valores são gerenciais e dependem dos cadastros.</div>`}
function ingredients(){return `<div class="card"><div class="sectionhead"><h2>Insumos e custo de aquisição</h2><span class="chip">${db.ingredients.length} cadastrados</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Ingrediente</th><th>Saldo físico</th><th>Custo por g / ml / un</th><th>Equivalente por kg / litro</th><th>Valor em estoque</th><th>Ações</th></tr></thead><tbody>${db.ingredients.map(x=>`<tr><td><b>${esc(x.name)}</b> ${x.quantity<=x.min?'<span class="pill warn">Baixo</span>':''}</td><td>${fmt(x.quantity)} ${esc(x.unit)}</td><td>${x.avgCost.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:6})} / ${x.unit}</td><td>${x.unit==='un'?'—':money(x.avgCost*1000)} / ${x.unit==='g'?'kg':'litro'}</td><td>${money(x.quantity*x.avgCost)}</td><td><button class="btn tiny" onclick="editIngredient(${x.id})">Editar</button></td></tr>`).join('')}</tbody></table></div><p class="scrollnote">O custo unitário não muda com uma saída de estoque. Ele só muda em compras com outro preço ou em uma correção administrativa explícita.</p><div class="controls"><button class="btn" onclick="purchase()">Registrar compra</button><button class="btn" onclick="adjust()">Ajustar inventário</button></div></div>`}
function detailed(r){return `<div class="detail"><div class="lineitem head"><span>Ingrediente</span><span>Qtd. no lote</span><span>R$/unidade</span><span>Custo no lote</span></div>${r.items.map(x=>{let i=ing(x.id);return `<div class="lineitem"><span>${esc(i?.name||'Ingrediente excluído')}</span><span>${fmt(x.qty)} ${esc(i?.unit||'')}</span><span>R$ ${n(i?.avgCost).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:6})} / ${esc(i?.unit||'')}</span><strong>${money(ingredientCost(x))}</strong></div>`}).join('')}${stat('Subtotal dos ingredientes',money(ingredientTotal(r)))}${Object.entries(r.costs||{}).map(([k,v])=>stat(({gas:'Gás',energy:'Energia',labor:'Mão de obra',packaging:'Embalagens',other:'Outros custos'})[k]||k,money(v))).join('')}${stat('Custo total do lote',money(batchCost(r)))}${stat('Custo unitário',money(unitCost(r)))}${stat('Preço de venda unitário',money(r.price))}${stat('Margem bruta estimada',r.price?fmt((r.price-unitCost(r))/r.price*100)+'%':'—')}</div>`}
function recipes(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(310px,1fr))">${db.recipes.map(r=>`<div class="card"><div class="eyebrow">Ficha técnica • ${labelMode(r.mode)}</div><h3 style="margin:12px 0">${esc(r.name)}</h3>${stat('Rendimento do lote',fmt(r.yield)+' unidades')}${stat('Custo unitário',money(unitCost(r)))}${stat('Preço de venda',money(r.price))}${stat('Disponível pronto',fmt(r.ready)+' unidades')}<details><summary class="btn tiny" style="margin:14px 0;display:inline-block;cursor:pointer">Ver cálculo ingrediente por ingrediente</summary>${detailed(r)}</details><div class="controls" style="margin-top:12px"><button class="btn tiny" onclick="editRecipe(${r.id})">Editar ficha</button>${r.mode==='production'?`<button class="btn tiny primary" onclick="produce(${r.id})">Produzir</button>`:''}<button class="btn tiny" onclick="navigate('movements')">Histórico</button></div></div>`).join('')}</div><div class="notice">A produção usa o custo médio atual. Ao registrar um lote, seu custo fica gravado no estoque de produtos prontos. A venda usa esse custo histórico, sem nova baixa dos ingredientes.</div>`}
function production(){return `<div class="card"><div class="sectionhead"><h2>Produtos acabados</h2><button class="btn primary" onclick="produce()">+ Produzir lote</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Modo</th><th>Em estoque</th><th>Valor estoque pronto</th><th>Ação</th></tr></thead><tbody>${db.recipes.map(r=>`<tr><td>${esc(r.name)}</td><td>${labelMode(r.mode)}</td><td>${r.mode==='production'?fmt(r.ready)+' un.':'Produzido sob demanda'}</td><td>${r.mode==='production'?money(r.readyValue):'—'}</td><td>${r.mode==='production'?`<button class="btn tiny" onclick="produce(${r.id})">Produzir</button>`:'<span class="muted">Baixa direta na venda</span>'}</td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h3>Lotes produzidos</h3>${table(db.production.slice().reverse(),['Data','Produto','Quantidade','Custo total'],x=>[x.date,esc(x.name),fmt(x.qty),money(x.cost)])}</div>`}
function table(rows,heads,fn){return rows.length?`<div class="tablewrap"><table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${fn(r).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhum lançamento ainda.</p>'}
function sales(){let t=total();return cards([['Faturamento',money(t.sales),'Valor vendido'],['Custo das vendas',money(t.cogs),'Custo registrado no momento'],['Margem de contribuição inicial',money(t.margin),'Antes de despesas operacionais'],['Unidades vendidas',fmt(db.sales.reduce((a,x)=>a+x.qty,0)),'Itens']])+`<div class="card section"><h3>Histórico de vendas</h3>${table(db.sales.slice().reverse(),['Data','Produto','Qtd.','Modo','Total','Custo','Resultado'],x=>[esc(x.date),esc(x.name),fmt(x.qty),x.mode==='production'?'Pronto':'Sob demanda',money(x.qty*x.price),money(x.cost),money(x.qty*x.price-x.cost)])}<p class="helper">Vendas e lotes são registros de movimentação. Não há exclusão simples que corrompa saldos; estornos serão uma função controlada na evolução do projeto.</p></div>`}
function purchases(){return `<div class="card"><h3>Compras e fornecedores</h3><p class="info">A entrada atualiza a quantidade e recalcula o custo médio ponderado do ingrediente.</p>${table(db.purchases.slice().reverse(),['Data','Ingrediente','Fornecedor','Quantidade','Valor'],x=>[esc(x.date),esc(x.name),esc(x.supplier||'—'),fmt(x.qty)+' '+esc(x.unit),money(x.total)])}</div>`}
function expenses(){return `<div class="card"><h3>Despesas do Gastrobar</h3>${table(db.expenses.slice().reverse(),['Data','Categoria','Descrição','Valor'],x=>[esc(x.date),esc(x.category),esc(x.description),money(x.amount)])}</div>`}
function reports(){let t=total(),by={};for(const s of db.sales){let e=by[s.name]||={qty:0,revenue:0,cost:0};e.qty+=s.qty;e.revenue+=s.qty*s.price;e.cost+=s.cost}return `<div class="two"><div class="card"><h3>Resultado gerencial acumulado</h3>${stat('Receitas',money(t.sales))}${stat('Custos dos produtos vendidos',money(t.cogs))}${stat('Margem antes das despesas',money(t.margin))}${stat('Despesas operacionais',money(t.expenses))}${stat('Resultado estimado',money(t.result))}<p class="helper">Ainda não é um DRE contábil nem considera tributos ou taxas não cadastrados.</p></div><div class="card"><h3>Lucro por produto</h3>${table(Object.entries(by),['Produto','Vendas','Receita','Custo','Diferença'],([name,x])=>[esc(name),fmt(x.qty),money(x.revenue),money(x.cost),money(x.revenue-x.cost)])}</div></div>`}
function movements(){return `<div class="card"><h3>Livro de movimentações de estoque</h3><p class="info">Histórico de entradas, saídas por produção, vendas sob demanda e saídas de produtos prontos.</p>${table(db.movements.slice().reverse(),['Data','Evento','Item','Movimento','Custo'],x=>[esc(x.date),esc(x.type),esc(x.name),`${x.delta>=0?'+':''}${fmt(x.delta)} ${esc(x.unit)}`,money(x.value)])}</div>`}
function settings(){return `<div class="two"><div class="card"><h3>Informações gerais</h3><div class="formgrid"><div class="field full"><label>Nome da empresa</label><input id="business" value="${esc(db.settings.business)}"></div><div class="field"><label>Markup de referência (%)</label><input id="markup" type="number" value="${n(db.settings.markup)}"></div></div><button class="btn primary" style="margin-top:15px" onclick="db.settings.business=$('business').value;db.settings.markup=n($('markup').value);save();alert('Configurações salvas')">Salvar</button><p class="helper">O modo de baixa é configurado individualmente em cada ficha técnica.</p></div><div class="card"><h3>Backup e recuperação</h3><div class="controls"><button class="btn" onclick="exportData()">↓ Exportar JSON</button><button class="btn" onclick="$('import').click()">↑ Importar JSON</button></div><input id="import" type="file" accept="application/json" hidden onchange="importData(this)"><div class="notice">Dados guardados somente neste navegador. Não existe login, sincronização em nuvem nem integração fiscal nesta versão.</div><button class="btn danger tiny" onclick="resetData()">Restaurar demonstração</button></div></div>`}
function field(label,key,value='',type='text',attrs=''){return `<div class="field"><label>${esc(label)}</label><input name="${key}" value="${esc(value)}" type="${type}" ${attrs} required></div>`}
function select(label,key,opts,value){return `<div class="field"><label>${label}</label><select name="${key}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function modal(title,body,cb){$('modalTitle').textContent=title;$('modalBody').innerHTML=`<form id="entry" onsubmit="event.preventDefault();document.getElementById('saveBtn').click()">${body}</form>`;$('saveBtn').onclick=()=>{if(!$('entry').reportValidity())return;try{cb(new FormData($('entry')))}catch(e){alert(e.message)}};$('back').classList.add('open')}function closeModal(){$('back').classList.remove('open')}function finish(){save();closeModal();render()}
function movement(type,name,delta,unit,value,reference){db.movements.push({id:id(),date:today(),type,name,delta,unit,value,reference})}
function consume(r,qty,ref){let factor=qty/r.yield;let needed=new Map();for(const item of r.items)needed.set(item.id,(needed.get(item.id)||0)+item.qty*factor);for(const [iid,q] of needed){let i=ing(iid);if(!i)throw Error('Ingrediente da ficha não encontrado');if(i.quantity+1e-7<q)throw Error(`Estoque insuficiente: ${i.name}. Necessário ${fmt(q)} ${i.unit}; disponível ${fmt(i.quantity)}.`)}let total=0;for(const [iid,q] of needed){let i=ing(iid),v=q*i.avgCost;i.quantity=Math.max(0,i.quantity-q);movement('Consumo de ingrediente',i.name,-q,i.unit,v,ref);total+=v}return total}
function editIngredient(iid){let old=iid?ing(iid):null;modal(old?'Editar ingrediente':'Novo ingrediente',`<div class="formgrid">${field('Nome','name',old?.name||'')}${select('Unidade de controle','unit',[['g','Gramas'],['ml','Mililitros'],['un','Unidades']],old?.unit||'g')}${field('Saldo inicial / saldo conferido','quantity',old?.quantity??1000,'number','min="0" step="0.001"')}${field('Custo unitário (R$ por g/ml/un)','avgCost',old?.avgCost??.005,'number','min="0" step="any"')}${field('Estoque mínimo','min',old?.min??100,'number','min="0" step="any"')}</div><p class="helper">Exemplo: farinha a R$ 5,00/kg custa R$ 0,005 por grama. Para entradas de compras, use o módulo Compras.</p>`,f=>{let o={id:old?.id||id(),name:f.get('name').trim(),unit:f.get('unit'),quantity:n(f.get('quantity')),avgCost:n(f.get('avgCost')),min:n(f.get('min'))};if(!o.name)throw Error('Digite um nome');if(old){if(o.unit!==old.unit&&db.recipes.some(r=>r.items.some(x=>x.id===old.id)))throw Error('Unidade de ingrediente utilizado em receita não pode ser alterada');if(o.quantity!==old.quantity)movement('Ajuste administrativo',old.name,o.quantity-old.quantity,old.unit,Math.abs(o.quantity-old.quantity)*old.avgCost,'edicao');Object.assign(old,o)}else{db.ingredients.push(o);movement('Cadastro inicial',o.name,o.quantity,o.unit,o.quantity*o.avgCost,'cadastro')}finish()})}
function recipeRow(item={}){return `<div class="recipe-row">${select('Ingrediente','item',db.ingredients.map(i=>[i.id,i.name+' ('+i.unit+')']),item.id||db.ingredients[0]?.id)}${field('Quantidade no lote','qty',item.qty||0,'number','min="0" step="any"')}<button class="btn tiny danger" type="button" onclick="this.closest('.recipe-row').remove()">×</button></div>`}
function addRecipeRow(){$('items').insertAdjacentHTML('beforeend',recipeRow())}
function editRecipe(rid){if(!db.ingredients.length)return alert('Cadastre ingredientes antes.');let old=rid?rec(rid):null;let r=old||{name:'',yield:20,price:0,mode:'production',items:[],costs:{gas:0,energy:0,labor:0,packaging:0,other:0}};modal(old?'Editar ficha técnica':'Nova ficha técnica',`<div class="formgrid">${field('Nome do produto','name',r.name)}${field('Rendimento (unidades por lote)','yield',r.yield,'number','min="0.001" step="any"')}${field('Preço de venda unitário (R$)','price',r.price,'number','min="0" step="any"')}${select('Quando baixar os ingredientes?','mode',[['production','Na produção (estoque de prontos)'],['sales','Na venda (preparo sob demanda)']],r.mode)}${Object.entries({gas:'Gás do lote',energy:'Energia do lote',labor:'Mão de obra do lote',packaging:'Embalagem do lote',other:'Outros custos do lote'}).map(([k,v])=>field(v,k,r.costs?.[k]||0,'number','min="0" step="any"')).join('')}</div><h3 style="margin-top:18px">Ingredientes utilizados no lote</h3><div id="items">${(r.items.length?r.items:[{id:db.ingredients[0].id,qty:0}]).map(recipeRow).join('')}</div><button type="button" class="btn tiny" onclick="addRecipeRow()">+ Ingrediente</button><p class="helper">A ficha técnica é calculada para a quantidade informada no rendimento. Não misture gramas com quilos: 500 g = 500.</p>`,f=>{let mode=f.get('mode'),yieldQty=n(f.get('yield'));if(yieldQty<=0)throw Error('Rendimento inválido');if(old&&old.mode!==mode&&old.ready>0)throw Error('Zere o estoque de produtos prontos antes de mudar para baixa na venda');let items=[...document.querySelectorAll('#items .recipe-row')].map(row=>({id:n(row.querySelector('select').value),qty:n(row.querySelector('input').value)})).filter(x=>x.qty>0);if(!items.length)throw Error('Adicione ao menos um ingrediente');let costs={};for(const k of ['gas','energy','labor','packaging','other'])costs[k]=n(f.get(k));let obj={id:old?.id||id(),name:f.get('name').trim(),yield:yieldQty,price:n(f.get('price')),mode,items,costs,ready:old?.ready||0,readyValue:old?.readyValue||0};if(!obj.name)throw Error('Informe o nome');if(old)Object.assign(old,obj);else db.recipes.push(obj);finish()})}
function produce(selected){let candidates=db.recipes.filter(r=>r.mode==='production');if(!candidates.length)return alert('Configure uma receita para baixa na produção.');modal('Produzir lote',`<div class="formgrid">${select('Produto','recipeId',candidates.map(r=>[r.id,r.name]),selected||candidates[0].id)}${field('Quantidade de unidades prontas','qty',20,'number','min="0.001" step="any"')}</div><div class="hint">Os ingredientes são descontados agora. As unidades prontas entram em estoque e, ao vendê-las, só o produto pronto será descontado.</div>`,f=>{let r=rec(f.get('recipeId')),qty=n(f.get('qty'));if(qty<=0)throw Error('Quantidade inválida');let needed=clone(db);try{let ingredientsCost=consume(r,qty,'lote'),extra=extraTotal(r)*qty/r.yield,cost=ingredientsCost+extra;r.ready+=qty;r.readyValue+=cost;let e={id:id(),date:today(),recipeId:r.id,name:r.name,qty,cost};db.production.push(e);movement('Entrada de produto pronto',r.name,qty,'un',cost,e.id);finish()}catch(e){db=needed;throw e}})}
function sale(){if(!db.recipes.length)return alert('Cadastre um produto primeiro.');modal('Registrar venda',`<div class="formgrid">${select('Produto','recipeId',db.recipes.map(r=>[r.id,`${r.name} (${labelMode(r.mode)})`]),db.recipes[0].id)}${field('Quantidade vendida','qty',1,'number','min="0.001" step="any"')}${field('Data da venda','date',today(),'date')}</div><div class="hint">Produtos preparados: baixa apenas no estoque pronto. Produtos sob demanda: baixa ingredientes somente nesta venda.</div>`,f=>{let r=rec(f.get('recipeId')),qty=n(f.get('qty'));if(qty<=0)throw Error('Quantidade inválida');let before=clone(db);try{let cost;if(r.mode==='production'){if(r.ready+1e-7<qty)throw Error('Produtos prontos insuficientes. Produza o lote primeiro.');cost=r.readyValue*(qty/r.ready);r.ready=Math.max(0,r.ready-qty);r.readyValue=Math.max(0,r.readyValue-cost);movement('Venda de produto pronto',r.name,-qty,'un',cost,'venda')}else{cost=consume(r,qty,'venda')+extraTotal(r)*qty/r.yield}let s={id:id(),date:f.get('date'),recipeId:r.id,name:r.name,qty,price:n(r.price),cost,mode:r.mode};db.sales.push(s);finish()}catch(e){db=before;throw e}})}
function purchase(){if(!db.ingredients.length)return alert('Cadastre ingredientes primeiro.');modal('Registrar compra',`<div class="formgrid">${select('Ingrediente','ingredientId',db.ingredients.map(i=>[i.id,`${i.name} (${i.unit})`]),db.ingredients[0].id)}${field('Quantidade comprada na unidade do estoque','qty',1000,'number','min="0.001" step="any"')}${field('Valor total da compra (R$)','total',20,'number','min="0" step="any"')}${field('Fornecedor','supplier','')}${field('Data','date',today(),'date')}</div>`,f=>{let i=ing(f.get('ingredientId')),q=n(f.get('qty')),total=n(f.get('total'));if(q<=0)throw Error('Quantidade inválida');i.avgCost=(i.quantity*i.avgCost+total)/(i.quantity+q);i.quantity+=q;let x={id:id(),ingredientId:i.id,name:i.name,unit:i.unit,qty:q,total,supplier:f.get('supplier'),date:f.get('date')};db.purchases.push(x);movement('Compra / entrada',i.name,q,i.unit,total,x.id);finish()})}
function adjust(){if(!db.ingredients.length)return;modal('Ajustar inventário',`<div class="formgrid">${select('Ingrediente','ingredientId',db.ingredients.map(i=>[i.id,`${i.name} (${i.unit})`]),db.ingredients[0].id)}${field('Saldo físico conferido','quantity',0,'number','min="0" step="any"')}</div><p class="helper">Use para contagem de estoque, perdas e acertos. O ajuste fica registrado no histórico.</p>`,f=>{let i=ing(f.get('ingredientId')),newQ=n(f.get('quantity')),delta=newQ-i.quantity;i.quantity=newQ;movement('Ajuste inventário',i.name,delta,i.unit,Math.abs(delta)*i.avgCost,'inventario');finish()})}
function expense(){modal('Cadastrar despesa',`<div class="formgrid">${select('Categoria','category',['Aluguel','Água','Energia','Gás','Internet','Salários','Marketing','Manutenção','Taxas','Outros'].map(x=>[x,x]),'Energia')}${field('Descrição','description','')}${field('Valor (R$)','amount',0,'number','min="0.01" step="any"')}${field('Data','date',today(),'date')}</div>`,f=>{if(n(f.get('amount'))<=0)throw Error('Valor inválido');db.expenses.push({id:id(),category:f.get('category'),description:f.get('description'),amount:n(f.get('amount')),date:f.get('date')});finish()})}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='almas-gemeas-gestao-pro-v2-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function importData(el){const f=el.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let raw=JSON.parse(reader.result),data=raw.version===2?normalize(raw):migrate(raw);if(!confirm('Substituir todos os dados locais pelos dados deste backup?'))return;db=data;save();render();alert('Backup importado')}catch(e){alert('Backup inválido: '+e.message)}};reader.readAsText(f)}
function resetData(){if(!confirm('Apagar os dados deste navegador e restaurar a demonstração? Faça backup antes.'))return;db=defaultDB();save();render()}
render();
</script></body></html>
