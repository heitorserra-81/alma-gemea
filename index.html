<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Almas Gêmeas • Gestão PRO</title><style>
:root{--bg:#0d1019;--panel:#171c29;--panel2:#1d2434;--line:#30394b;--ink:#f6f4fb;--muted:#9ca5b7;--gold:#f4b86a;--mint:#60d6b3;--red:#ff788b;--violet:#b6a2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -18%,#2a284e,transparent 55%),var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#111521;border-right:1px solid var(--line);padding:23px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:9px 9px 24px}.brandmark{width:52px;height:52px;border-radius:50%;background:conic-gradient(#ff638c,#ffb847,#dbeb67,#58ddb6,#67b7ff,#b587ff,#ff638c);display:grid;place-items:center;box-shadow:0 0 28px #ff8c6644;transform-style:preserve-3d;animation:float 5s ease-in-out infinite}.brandmark b{width:42px;height:42px;border:2px solid #fff9;border-radius:50%;display:grid;place-items:center;color:white;font-size:22px;text-shadow:0 2px 7px #000}@keyframes float{50%{transform:translateY(-4px) rotateY(12deg)}}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--gold);letter-spacing:.13em;font-size:10px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#a8b1c4;text-align:left;border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:13px;transition:.2s}.nav button:hover{background:#252b3c;color:#fff;transform:translateX(3px)}.nav button.active{background:linear-gradient(110deg,#4b3844,#302a42);color:#fff;box-shadow:inset 3px 0 var(--gold)}.nav .ico{font-size:19px;width:22px;text-align:center}.sidefoot{border-top:1px solid var(--line);margin-top:30px;padding:20px 12px;color:var(--muted);font-size:12px;line-height:1.6}.main{padding:29px clamp(16px,3.5vw,52px) 70px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:750;text-transform:uppercase}.top h1{margin:7px 0 0;font-size:clamp(24px,3vw,34px);letter-spacing:-.04em}.top p{color:var(--muted);margin:8px 0 0;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #4d5360;background:#252c3d;color:white;border-radius:11px;padding:11px 15px;transition:.2s;font-weight:650;font-size:13px}.btn:hover{transform:translateY(-2px);border-color:var(--gold)}.btn.primary{background:linear-gradient(135deg,#f6c377,#d68d4a);color:#241a13;border:0;box-shadow:0 8px 24px #f4b86a25}.btn.danger{background:#412331;color:#ffb4c1;border-color:#643744}.btn.tiny{padding:7px 9px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:linear-gradient(155deg,#1b2232,#161c29);border:1px solid #303a4a;border-radius:18px;padding:20px;box-shadow:0 14px 45px #0002;transition:transform .25s,border-color .25s;min-width:0}.card:hover{transform:translateY(-2px);border-color:#666174}.metric .value{font-size:clamp(19px,2.5vw,29px);font-weight:800;letter-spacing:-.04em;margin-top:14px}.muted{color:var(--muted)}.metric .muted{font-size:12px}.metric .tag{color:var(--mint);font-size:11px;margin-top:8px}.section{margin-top:20px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.sectionhead h2{font-size:18px;margin:0}.card h3{margin:0 0 15px;font-size:16px}.info{font-size:13px;color:var(--muted);line-height:1.65}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:650}.table td,.table th{padding:13px 11px;border-bottom:1px solid #31394a}.table tr:last-child td{border-bottom:0}.table td.right,.table th.right{text-align:right}.pill{font-size:11px;padding:5px 9px;border-radius:25px;background:#273d3c;color:#7eefd1}.pill.warn{background:#4b3433;color:#ffc5a4}.actions{display:flex;gap:5px;justify-content:flex-end}.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#c6cbdb}.field input,.field select{background:#101623;color:var(--ink);border:1px solid #414c60;border-radius:11px;padding:12px;min-width:0;outline:none;width:100%}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f4b86a20}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#02040bba;backdrop-filter:blur(10px);display:none;z-index:100;align-items:center;justify-content:center;padding:17px}.modalback.open{display:flex}.modal{background:#1a2130;border:1px solid #535465;border-radius:22px;padding:24px;max-width:650px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 35px 100px #0009}.modal h2{margin:0 0 10px}.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.recipe-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}.notice{border-left:3px solid var(--gold);padding:11px 15px;background:#382d2c;border-radius:7px;color:#f3d1aa;font-size:12px;margin:15px 0}.bars{display:flex;height:140px;align-items:end;gap:13px;padding:8px 3px 0}.barcol{flex:1;text-align:center;min-width:0}.bar{background:linear-gradient(0deg,#9168dd,#e9b66e);border-radius:7px 7px 2px 2px;min-height:5px;animation:up .75s ease backwards;box-shadow:0 0 15px #d3a06925}.barcol span{display:block;font-size:10px;color:var(--muted);margin-top:8px;overflow:hidden;text-overflow:ellipsis}@keyframes up{from{height:0}}.profit{font-weight:700;color:var(--mint)}.scrollnote{font-size:12px;color:var(--muted);margin-top:12px}.menu{display:none}.statline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.statline:last-child{border:0}.receipt{display:flex;align-items:center;gap:9px;padding:8px 0}.receipt input{width:90px}.helper{font-size:11px;color:var(--muted);line-height:1.5}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:50;left:0;top:0;bottom:0;width:245px;transform:translateX(-100%);transition:.3s;box-shadow:20px 0 70px #0008}.sidebar.show{transform:translateX(0)}.menu{display:block}.main{padding:21px 14px 65px}.top{align-items:flex-start}.top h1{font-size:26px}.toolbar{justify-content:flex-end}.formgrid{grid-template-columns:1fr}.grid{gap:10px}.card{padding:14px}.metric .value{font-size:23px}.recipe-row{grid-template-columns:1fr 85px auto}}
</style></head><body><div class="app"><aside class="sidebar" id="side"><div class="brand"><div class="brandmark"><b>♥</b></div><div><strong>Almas Gêmeas</strong><small>GASTROBAR • GESTÃO PRO</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">Sistema demonstrativo funcional.<br>Os dados ficam salvos neste navegador.<br><b>Versão 1.0 • Protótipo local</b></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Almas Gêmeas • Gestão inteligente</div><h1 id="title">Visão geral</h1><p id="subtitle">Controle do seu negócio, com simplicidade.</p></div><div class="toolbar"><button class="btn menu" onclick="toggleMenu()">☰ Menu</button><button class="btn" onclick="exportData()">↓ Backup</button><button class="btn primary" id="newBtn">+ Novo</button></div></header><div id="content" class="fade"></div></main></div><div class="modalback" id="back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveBtn">Salvar</button></div></div></div><script>
const KEY='almas_gemeas_pro_v1';const defaultDB=()=>({ingredients:[{id:1,name:'Farinha de trigo',quantity:5000,unit:'g',price:25,min:500},{id:2,name:'Frango',quantity:3000,unit:'g',price:60,min:800},{id:3,name:'Leite',quantity:4000,unit:'ml',price:22,min:1000},{id:4,name:'Óleo',quantity:2700,unit:'ml',price:24,min:500},{id:5,name:'Temperos',quantity:800,unit:'g',price:24,min:150}],recipes:[{id:101,name:'Coxinha de frango',yield:20,extra:5.4,items:[{id:1,qty:500},{id:2,qty:600},{id:3,qty:300},{id:4,qty:100},{id:5,qty:50}],price:6}],sales:[],expenses:[],purchases:[],settings:{business:'Almas Gêmeas Gastrobar',currency:'BRL',markup:150,tax:0,waste:0}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultDB()}catch{db=defaultDB()}const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),rid=()=>Date.now()+Math.floor(Math.random()*1000),br=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=x=>Number(x||0),fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const menus=[['dashboard','◈','Visão geral'],['ingredients','◉','Ingredientes e estoque'],['recipes','♨','Receitas e preços'],['sales','▣','Vendas e caixa'],['purchases','▤','Compras'],['expenses','◇','Despesas'],['reports','▥','Relatórios'],['settings','⚙','Administração']];let page='dashboard';function navigate(p){page=p;$('side').classList.remove('show');render()}function toggleMenu(){$('side').classList.toggle('show')}function ing(i){return db.ingredients.find(x=>x.id===i)}function itemCost(item){let i=ing(item.id);return i?num(i.price)/num(i.quantity||1)*num(item.qty):0}function recipeCost(r){return (r.items||[]).reduce((s,i)=>s+itemCost(i),0)+num(r.extra)}function soldCost(s){return num(s.cost)*num(s.qty)}function totals(){let sales=db.sales.reduce((n,s)=>n+num(s.price)*num(s.qty),0),cogs=db.sales.reduce((n,s)=>n+soldCost(s),0),expenses=db.expenses.reduce((n,e)=>n+num(e.amount),0),purchases=db.purchases.reduce((n,e)=>n+num(e.total),0);return {sales,cogs,expenses,purchases,result:sales-cogs-expenses}}function render(){let meta={dashboard:['Visão geral','Indicadores, alertas e desempenho do Gastrobar.'],ingredients:['Ingredientes e estoque','Custos por unidade de medida e movimentação de estoque.'],recipes:['Fichas técnicas e precificação','Quanto custa produzir e quanto cobrar em cada receita.'],sales:['Vendas e caixa','Registre vendas e acompanhe o resultado comercial.'],purchases:['Compras e fornecedores','Entradas de produtos e histórico de compras.'],expenses:['Despesas','Acompanhe os gastos operacionais.'],reports:['Relatórios gerenciais','Analise custos, vendas e resultados.'],settings:['Administração','Configurações e segurança dos seus dados.']}[page];$('title').textContent=meta[0];$('subtitle').textContent=meta[1];$('nav').innerHTML=menus.map(m=>`<button class="${m[0]===page?'active':''}" onclick="navigate('${m[0]}')"><span class="ico">${m[1]}</span>${m[2]}</button>`).join('');$('newBtn').style.display=['dashboard','reports','settings'].includes(page)?'none':'block';$('newBtn').onclick=()=>newItem(page);$('content').className='fade';$('content').innerHTML=({dashboard:dashboard,ingredients:ingredients,recipes:recipes,sales:sales,purchases:purchases,expenses:expenses,reports:reports,settings:settings})[page]()}function metrics(data){return `<div class="grid">${data.map(m=>`<div class="card metric"><div class="muted">${m[0]}</div><div class="value">${m[1]}</div><div class="tag">${m[2]}</div></div>`).join('')}</div>`}function low(){return db.ingredients.filter(i=>num(i.quantity)<=num(i.min))}function dashboard(){let t=totals();return metrics([['Faturamento registrado',br(t.sales),'Total das vendas'],['Resultado gerencial',br(t.result),'Vendas − custo vendido − despesas'],['Receitas cadastradas',db.recipes.length,'Fichas técnicas'],['Estoque em alerta',low().length+' itens','Abaixo ou no estoque mínimo']])+`<div class="two section"><div class="card"><h3>Últimas vendas</h3>${saleTable(db.sales.slice(-6).reverse())}</div><div class="card"><h3>Estoque e atalhos</h3>${low().length?low().map(i=>`<div class="statline"><span>⚠ ${esc(i.name)}</span><strong>${fmt(i.quantity)} ${esc(i.unit)}</strong></div>`).join(''):'<p class="info">Nenhum ingrediente abaixo do mínimo.</p>'}<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn tiny" onclick="navigate('recipes')">Ver fichas técnicas</button><button class="btn tiny" onclick="navigate('purchases')">Registrar compra</button></div></div></div><div class="notice">Este é um protótipo local de demonstração. Os dados de exemplo são fictícios. Não substitui um sistema fiscal homologado nem oferece sincronização entre aparelhos.</div>`}
function ingredients(){return `<div class="card"><div class="sectionhead"><h2>Cadastro de ingredientes</h2><span class="muted">${db.ingredients.length} itens</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Ingrediente</th><th>Estoque</th><th>Valor do lote atual</th><th>Custo por unidade</th><th>Status</th><th class="right">Ações</th></tr></thead><tbody>${db.ingredients.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${fmt(i.quantity)} ${esc(i.unit)}</td><td>${br(i.price)}</td><td>${br(i.price/(i.quantity||1))}/${esc(i.unit)}</td><td><span class="pill ${i.quantity<=i.min?'warn':''}">${i.quantity<=i.min?'Baixo':'Normal'}</span></td><td><div class="actions"><button class="btn tiny" onclick="editIngredient(${i.id})">Editar</button><button class="btn tiny danger" onclick="remove('ingredients',${i.id})">Excluir</button></div></td></tr>`).join('')}</tbody></table></div><div class="scrollnote">O valor informado representa o preço da quantidade cadastrada. Compras posteriores podem atualizar custo e quantidade.</div></div>`}function recipes(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${db.recipes.map(r=>{let cost=recipeCost(r),u=cost/(r.yield||1),p=num(r.price);return `<div class="card"><div class="eyebrow">Ficha técnica</div><h3 style="margin:10px 0">${esc(r.name)}</h3><div class="statline"><span>Rendimento</span><strong>${fmt(r.yield)} un.</strong></div><div class="statline"><span>Custo total do lote</span><strong>${br(cost)}</strong></div><div class="statline"><span>Custo por unidade</span><strong>${br(u)}</strong></div><div class="statline"><span>Preço de venda</span><strong>${br(p)}</strong></div><div class="statline"><span>Margem bruta unitária</span><strong class="profit">${p?fmt((p-u)/p*100)+'%':'—'}</strong></div><div style="display:flex;gap:7px;margin-top:17px"><button class="btn tiny" onclick="editRecipe(${r.id})">Editar ficha</button><button class="btn tiny danger" onclick="remove('recipes',${r.id})">Excluir</button></div></div>`}).join('')}</div>${db.recipes.length?'':'<div class="card empty">Cadastre sua primeira receita para calcular custos e preços.</div>'}<div class="notice">Os custos de gás, energia, mão de obra e embalagem podem ser somados no campo “Outros custos por lote”. Uma etapa futura permitirá cálculo automático detalhado por equipamento, tempo e tarifa.</div>`}
function saleTable(rows){if(!rows.length)return '<div class="empty">Nenhuma venda registrada ainda.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Produto</th><th>Qtd.</th><th>Total</th><th class="right">Ações</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.name)}</td><td>${fmt(s.qty)}</td><td>${br(s.qty*s.price)}</td><td class="right"><button class="btn tiny danger" onclick="remove('sales',${s.id})">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}function sales(){let t=totals();return metrics([['Vendas',br(t.sales),'Faturamento'],['Custos das unidades',br(t.cogs),'Baseado na ficha no dia da venda'],['Margem antes das despesas',br(t.sales-t.cogs),'Receita menos custo vendido'],['Total de unidades',fmt(db.sales.reduce((a,x)=>a+x.qty,0)),'Itens vendidos']])+`<div class="card section"><h3>Histórico de vendas</h3>${saleTable(db.sales.slice().reverse())}</div>`}function purchases(){return `<div class="card"><h3>Registro de compras e entradas</h3><p class="info">Cada compra aumenta o estoque do ingrediente. O custo unitário é recalculado por média ponderada.</p><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Ingrediente</th><th>Fornecedor</th><th>Quantidade</th><th>Total</th></tr></thead><tbody>${db.purchases.slice().reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.name)}</td><td>${esc(p.supplier)}</td><td>${fmt(p.qty)} ${esc(p.unit)}</td><td>${br(p.total)}</td></tr>`).join('')}</tbody></table>${db.purchases.length?'':'<div class="empty">Nenhuma compra registrada ainda.</div>'}</div></div>`}function expenses(){return `<div class="card"><h3>Despesas operacionais</h3><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th class="right">Ações</th></tr></thead><tbody>${db.expenses.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${br(e.amount)}</td><td class="right"><button class="btn tiny danger" onclick="remove('expenses',${e.id})">Excluir</button></td></tr>`).join('')}</tbody></table>${db.expenses.length?'':'<div class="empty">Nenhuma despesa cadastrada.</div>'}</div></div>`}function reports(){let t=totals(),by={};db.sales.forEach(s=>{by[s.name]=(by[s.name]||0)+s.price*s.qty});let list=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6),max=Math.max(1,...list.map(x=>x[1]));return `<div class="two"><div class="card"><h3>Receita por produto</h3>${list.length?`<div class="bars">${list.map(([k,v])=>`<div class="barcol"><div title="${esc(k)}: ${br(v)}" class="bar" style="height:${Math.max(6,v/max*105)}px"></div><span>${esc(k)}</span></div>`).join('')}</div>`:'<div class="empty">Registre vendas para gerar gráficos.</div>'}</div><div class="card"><h3>Resumo financeiro</h3>${[['Vendas',t.sales],['Custo de produtos vendidos',-t.cogs],['Despesas operacionais',-t.expenses],['Resultado gerencial estimado',t.result],['Compras registradas (fluxo de caixa)',-t.purchases]].map(([k,v])=>`<div class="statline"><span>${k}</span><strong>${br(v)}</strong></div>`).join('')}<p class="helper">Compras compõem o estoque e não são abatidas novamente do resultado baseado em custo vendido. O fluxo de caixa exige também conciliação de pagamentos, receitas e saldos.</p></div></div>`}function settings(){return `<div class="two"><div class="card"><h3>Dados do negócio</h3><div class="formgrid"><div class="field full"><label>Nome da empresa</label><input id="setBusiness" value="${esc(db.settings.business)}"></div><div class="field"><label>Markup sugerido (%)</label><input id="setMarkup" type="number" value="${num(db.settings.markup)}"></div><div class="field"><label>Taxa referencial (%)</label><input id="setTax" type="number" value="${num(db.settings.tax)}"></div></div><div style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div><p class="helper">Parâmetros de referência. O cadastro de cada receita possui preço de venda próprio.</p></div><div class="card"><h3>Backup e recuperação</h3><p class="info">Exporte todos os seus cadastros em JSON. Você poderá importar esses dados neste navegador.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportData()">↓ Exportar JSON</button><button class="btn" onclick="$('import').click()">↑ Importar JSON</button></div><input type="file" id="import" accept="application/json" style="display:none" onchange="importData(this)"><div class="notice">Não existe login real nem armazenamento em nuvem nesta versão. Não compartilhe este dispositivo com pessoas não autorizadas e faça backups frequentes.</div><button class="btn danger tiny" onclick="resetData()">Restaurar dados de exemplo</button></div></div>`}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></div>`}function selectField(label,name,opts,selected){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(selected)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}function openModal(title,body,submit){$('modalTitle').textContent=title;$('modalBody').innerHTML=`<form id="entry" onsubmit="event.preventDefault();document.getElementById('saveBtn').click()">${body}</form>`;$('saveBtn').onclick=()=>{let f=$('entry');if(!f.reportValidity())return;submit(new FormData(f))};$('back').classList.add('open')}function closeModal(){$('back').classList.remove('open')}function done(){save();closeModal();render()}function newItem(p){({ingredients:()=>editIngredient(null),recipes:()=>editRecipe(null),sales:newSale,purchases:newPurchase,expenses:newExpense})[p]?.()}function editIngredient(id){let old=db.ingredients.find(x=>x.id===id)||{name:'',quantity:1000,unit:'g',price:0,min:100};openModal(id?'Editar ingrediente':'Novo ingrediente',`<div class="formgrid">${field('Nome do ingrediente','name','text',old.name)}${selectField('Unidade de controle','unit',[['g','Gramas (g)'],['ml','Mililitros (ml)'],['un','Unidades (un)']],old.unit)}${field('Quantidade atual no estoque','quantity','number',old.quantity,'step="0.001" min="0"')}${field('Valor de referência desse estoque (R$)','price','number',old.price,'step="0.01" min="0"')}${field('Estoque mínimo','min','number',old.min,'step="0.001" min="0"')}</div><p class="helper">Use a mesma unidade nas receitas. Exemplo: 5 kg = 5000 g.</p>`,f=>{let obj={id:id||rid(),name:f.get('name').trim(),unit:f.get('unit'),quantity:num(f.get('quantity')),price:num(f.get('price')),min:num(f.get('min'))};if(id)Object.assign(old,obj);else db.ingredients.push(obj);done()})}function remove(kind,id){if(!confirm('Deseja realmente excluir este registro?'))return;if(kind==='ingredients'&&db.recipes.some(r=>r.items.some(i=>i.id===id))){alert('Ingrediente utilizado em receita. Remova-o das fichas técnicas antes de excluir.');return}if(kind==='sales'){let s=db.sales.find(s=>s.id===id);if(s){let r=db.recipes.find(r=>r.id===s.recipeId);if(r)r.items.forEach(item=>{let i=ing(item.id);if(i)i.quantity+=item.qty*s.qty/r.yield})}}db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
function editRecipe(id){let old=db.recipes.find(r=>r.id===id)||{name:'',yield:10,price:0,extra:0,items:[]};const opts=db.ingredients.map(i=>[i.id,`${i.name} (${i.unit})`]);const rows=old.items.length?old.items:[{id:db.ingredients[0]?.id,qty:0}];openModal(id?'Editar ficha técnica':'Nova receita',`<div class="formgrid">${field('Nome da receita','name','text',old.name)}${field('Rendimento (unidades)','yield','number',old.yield,'min="0.01" step="0.01"')}${field('Outros custos do lote (R$)','extra','number',old.extra,'min="0" step="0.01"')}${field('Preço de venda por unidade (R$)','price','number',old.price,'min="0" step="0.01"')}</div><h3 style="margin-top:23px">Ingredientes utilizados</h3><div id="recipeItems">${rows.map(x=>recipeLine(opts,x)).join('')}</div><button class="btn tiny" type="button" onclick="addRecipeLine()">+ Adicionar ingrediente</button><p class="helper">Se a receita render 20 unidades, informe a quantidade total de cada ingrediente usada nas 20 unidades.</p>`,f=>{let items=[...document.querySelectorAll('.recipe-row')].map(row=>({id:num(row.querySelector('select').value),qty:num(row.querySelector('input').value)})).filter(x=>x.id&&x.qty>0);let obj={id:id||rid(),name:f.get('name').trim(),yield:num(f.get('yield')),price:num(f.get('price')),extra:num(f.get('extra')),items};if(id)Object.assign(old,obj);else db.recipes.push(obj);done()})}function recipeLine(opts,item){return `<div class="recipe-row">${selectField('Ingrediente','i',opts,item.id)}${field('Quantidade','q','number',item.qty,'min="0" step="0.001"')}<button type="button" class="btn tiny danger" onclick="this.closest('.recipe-row').remove()">×</button></div>`}function addRecipeLine(){if(!db.ingredients.length){alert('Cadastre ingredientes primeiro.');return}$('recipeItems').insertAdjacentHTML('beforeend',recipeLine(db.ingredients.map(i=>[i.id,`${i.name} (${i.unit})`]),{id:db.ingredients[0].id,qty:0}))}function newSale(){if(!db.recipes.length){alert('Cadastre uma receita primeiro.');return}openModal('Registrar venda',`<div class="formgrid">${selectField('Produto','recipeId',db.recipes.map(r=>[r.id,r.name]),db.recipes[0].id)}${field('Quantidade vendida','qty','number',1,'step="1" min="1"')}${field('Data','date','date',new Date().toISOString().slice(0,10))}</div><div class="notice">A venda retira ingredientes do estoque conforme a ficha técnica. O custo da receita é registrado no momento da venda.</div>`,f=>{let r=db.recipes.find(r=>r.id===num(f.get('recipeId'))),qty=num(f.get('qty'));for(let it of r.items){let i=ing(it.id);if(i&&i.quantity+1e-8<it.qty*qty/r.yield){if(!confirm(`Estoque insuficiente de ${i.name}. Registrar a venda mesmo assim?`))return;break}}let cost=recipeCost(r)/r.yield;db.sales.push({id:rid(),recipeId:r.id,name:r.name,qty,price:r.price,cost,date:f.get('date')});r.items.forEach(it=>{let i=ing(it.id);if(i)i.quantity-=it.qty*qty/r.yield});done()})}function newPurchase(){if(!db.ingredients.length){alert('Cadastre um ingrediente primeiro.');return}openModal('Registrar compra e entrada',`<div class="formgrid">${selectField('Ingrediente','ingredientId',db.ingredients.map(i=>[i.id,`${i.name} (${i.unit})`]),db.ingredients[0].id)}${field('Quantidade comprada','qty','number',1000,'min="0.001" step="0.001"')}${field('Valor total pago (R$)','total','number',20,'min="0" step="0.01"')}${field('Fornecedor','supplier','text','')}${field('Data','date','date',new Date().toISOString().slice(0,10))}</div>`,f=>{let i=ing(num(f.get('ingredientId'))),qty=num(f.get('qty')),total=num(f.get('total'));let oldq=num(i.quantity),oldv=num(i.price);i.quantity+=qty;i.price+=total;db.purchases.push({id:rid(),ingredientId:i.id,name:i.name,unit:i.unit,qty,total,supplier:f.get('supplier'),date:f.get('date')});done()})}function newExpense(){openModal('Cadastrar despesa',`<div class="formgrid">${selectField('Categoria','category',['Aluguel','Água','Energia','Gás','Internet','Salários','Marketing','Manutenção','Taxas','Outros'].map(x=>[x,x]),'Energia')}${field('Descrição','description','text','')}${field('Valor (R$)','amount','number',0,'min="0.01" step="0.01"')}${field('Data','date','date',new Date().toISOString().slice(0,10))}</div>`,f=>{db.expenses.push({id:rid(),category:f.get('category'),description:f.get('description'),amount:num(f.get('amount')),date:f.get('date')});done()})}function saveSettings(){db.settings.business=$('setBusiness').value;db.settings.markup=num($('setMarkup').value);db.settings.tax=num($('setTax').value);save();alert('Configurações salvas!')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='almas-gemeas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.ingredients)||!Array.isArray(o.recipes)||!Array.isArray(o.sales)||!Array.isArray(o.expenses)||!Array.isArray(o.purchases)||!o.settings)throw Error('Arquivo inválido');if(!confirm('Substituir todos os dados atuais pelo backup?'))return;db=o;save();render();alert('Backup restaurado!')}catch(e){alert('Não foi possível importar: '+e.message)}};r.readAsText(file)}function resetData(){if(confirm('Restaurar os dados iniciais? Isso apaga os dados atuais neste navegador.')){db=defaultDB();save();render()}}render();</script></body></html>
